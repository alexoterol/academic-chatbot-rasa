- intent: bot_challenge
  examples: |
    - are you a bot?
    - are you a human?
    - am I talking to a bot?
    - am I talking to a human?

- intent: translate
  examples: |
    - Quiero que me traduzcas "[hola](text)" en [francés](target_language)
    - Traducir "[hello](text)" al [italiano](target_language)
    - Cómo se dice "[puerta](text)" en [inglés](target_language)?
    - Traduce "[gracias](text)" al [alemán](target_language)
    - Traduce "[buenos días](text)" al [inglés](target_language)
    - Cómo se dice "[libro](text)" en [alemán](target_language)?
    - translate "[good morning](text)" to [spanish](target_language)
    - how do you say "[thank you](text)" in [french](target_language)?
    - can you translate "[cat](text)" into [italian](target_language)
    - please translate "[water](text)" to [german](target_language)
    - traduce "[amigo](text)" al [inglés](target_language)
    - quiero saber cómo se dice "[amor](text)" en [italiano](target_language)

- intent: out_of_scope
  examples: |
    - what's the weather like today?
    - can you book a flight for me?
    - tell me a joke
    - what is your favorite food?
    - can you help me with my homework?
    - who won the football game last night?
    - qué tiempo hace hoy?
    - puedes pedirme una pizza?