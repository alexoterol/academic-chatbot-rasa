version: "3.1"

rules:

- rule: Say goodbye anytime the user says goodbye
  steps:
  - intent: goodbye
  - action: utter_goodbye

- rule: Say 'I am a bot' anytime the user challenges
  steps:
  - intent: bot_challenge
  - action: utter_iamabot

- rule: Handle low NLU confidence or out-of-scope messages
  steps:
  - intent: nlu_fallback
  - action: utter_default

- rule: Handle explicit out-of-scope requests
  steps:
  - intent: out_of_scope
  - action: utter_default
